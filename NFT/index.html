<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="cube-content">
          <img
            src="images/image-equilibrium.jpg"
            class="cube hover-img"
            alt="image-equilibrium"
          />
          <div class="view-effect">
            <img class="icon-view" src="images/icon-view.svg" alt="icon-view" />
          </div>
        </div>

        <p class="bold main-para white-text hover">Equilibrium #3429</p>
        <p class="main-para">
          Our Equilibrium collection promotes <br />
          balance and calm.
        </p>
        <p class="icon-para icon-space">
          <img
            class="small-icon"
            src="images/icon-ethereum.svg"
            alt="image-ethereum"
          />0.041ETH
        </p>
        <p class="icon-para">
          <img
            class="small-icon"
            src="images/icon-clock.svg"
            alt="icon-clock"
          />3 days left
        </p>
        <hr />
        <div class="footer">
          <img
            class="avatar"
            src="images/image-avatar.png"
            alt="image-avatar"
          />
          <p>Creation of <span class="white-text hover">Jules Wyvern</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
